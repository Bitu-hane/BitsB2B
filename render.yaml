# Render Blueprint Infrastructure Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. NestJS Backend REST API Web Service
  - type: web
    name: bitsb2b-backend
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: bitsb2b-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bitsb2b-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: bitsb2b-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bitsb2b-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: bitsb2b-db
          property: database
      - key: JWT_SECRET
        generateValue: true

  # 2. Vite React Frontend Static Site
  - type: web
    name: bitsb2b-frontend
    runtime: static
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bitsb2b-backend
          property: url

databases:
  # 3. PostgreSQL Database Service
  - name: bitsb2b-db
    region: singapore
    plan: starter
    databaseName: bitsb2b
    user: bitsb2b_user
